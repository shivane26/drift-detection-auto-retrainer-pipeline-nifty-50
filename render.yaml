services:
  - type: web
    name: nifty-mlops-api
    runtime: python311
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.app:app --host 0.0.0.0 --port 8080
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: true
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /api/meta
    healthCheckInterval: 300
    autoDeploy: true
